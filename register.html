<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Marketly - Register</title>
    <script src='https://cdn.c360a.salesforce.com/beacon/c360a/70d3a9cb-b0b5-4508-a730-c680a7f2ce07/scripts/c360a.min.js'></script>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-bg">
    <div id="header"></div>
    <main class="auth-wrap">
        <form id="registerForm" class="auth-card"><span class="eyebrow">CREATE ACCOUNT</span>
            <h1>Join Marketly</h1>
            <p>Create a demo account in seconds.</p><label>Full name<input id="name" required></label><label>Email<input
                    id="email" type="email" required></label><label>Password<input id="password" type="password"
                    minlength="4" required></label><button class="btn full" type="submit">Create account</button>
            <p class="auth-foot">Already registered? <a href="login.html">Login</a></p>
        </form>
    </main>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script>window.addEventListener('DOMContentLoaded', () => initRegister())</script>
</body>

</html>
