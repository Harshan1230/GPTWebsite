<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Marketly - Products</title>
    <script src='https://cdn.c360a.salesforce.com/beacon/c360a/70d3a9cb-b0b5-4508-a730-c680a7f2ce07/scripts/c360a.min.js'></script>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div id="header"></div>
    <main class="container">
        <div class="page-title"><span class="eyebrow">COLLECTION</span>
            <h1>All products</h1>
            <p>Find something you'll love.</p>
        </div>
        <div class="toolbar">
            <div id="categoryFilters" class="filters"></div><select id="sort">
                <option value="default">Sort by</option>
                <option value="low">Price: Low to high</option>
                <option value="high">Price: High to low</option>
                <option value="name">Name</option>
            </select>
        </div>
        <div id="productList" class="product-grid"></div>
    </main>
    <div id="footer"></div>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script>window.addEventListener('DOMContentLoaded', () => initProducts())</script>
</body>

</html>
